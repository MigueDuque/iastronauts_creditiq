name: Frontend — Build & Deploy

on:
  push:
    branches: [main, uat, master]
    paths:
      - 'iastronauts_creditiq_front/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main, uat, master]
    paths:
      - 'iastronauts_creditiq_front/**'

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  # ── BUILD + LINT ──────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iastronauts_creditiq_front

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: iastronauts_creditiq_front/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build de producción (dev vars)
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL_DEV }}
          VITE_STAGE:   dev

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: iastronauts_creditiq_front/dist/
          retention-days: 1

  # ── DEPLOY DEV ────────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy → dev
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/uat' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: dev

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist/

      - name: Sync a S3 — dev
        run: |
          BUCKET="iastronauts-creditiq-frontend-us-east-1-dev"

          aws s3 sync dist/ s3://$BUCKET/ \
            --delete \
            --exclude "index.html" \
            --cache-control "max-age=31536000,immutable"

          aws s3 cp dist/index.html s3://$BUCKET/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidar CloudFront — dev
        run: |
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name creditiq-dev \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*"
          echo "Invalidación creada: $DIST_ID"

  # ── DEPLOY PROD ───────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy → production
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: iastronauts_creditiq_front/package-lock.json

      - name: Instalar dependencias
        working-directory: iastronauts_creditiq_front
        run: npm ci

      - name: Build prod
        working-directory: iastronauts_creditiq_front
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL_PROD }}
          VITE_STAGE:   prod

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Sync a S3 — prod
        run: |
          BUCKET="iastronauts-creditiq-frontend-us-east-1-prod"

          aws s3 sync iastronauts_creditiq_front/dist/ s3://$BUCKET/ \
            --delete \
            --exclude "index.html" \
            --cache-control "max-age=31536000,immutable"

          aws s3 cp iastronauts_creditiq_front/dist/index.html \
            s3://$BUCKET/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidar CloudFront — prod
        run: |
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name creditiq-prod \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*"
          echo "Invalidación creada: $DIST_ID"
