name: Backend — Build & Deploy

on:
  push:
    branches: [main, uat, master]
    paths:
      - 'iastronauts_creditiq_back/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, uat, master]
    paths:
      - 'iastronauts_creditiq_back/**'

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  SAM_ARTIFACTS_BUCKET: ${{ secrets.SAM_ARTIFACTS_BUCKET }}

jobs:
  # ── TEST ──────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iastronauts_creditiq_back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: iastronauts_creditiq_back/src/requirements.txt

      - name: Instalar dependencias
        run: |
          pip install -r src/requirements.txt
          pip install pytest pytest-cov

      - name: Ejecutar tests
        run: pytest tests/ -v --tb=short
        env:
          LLM_PROVIDER: anthropic_api
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_DEV }}
          AWS_REGION: ${{ env.AWS_REGION }}
          STAGE: test
          MAIN_BUCKET: test-bucket
          WORKFLOW_ARN: arn:aws:states:us-east-1:000000000000:stateMachine:test
          AWS_ACCOUNT_ID: "000000000000"
          ANTHROPIC_API_KEY_SECRET_ARN: arn:aws:secretsmanager:us-east-1:000000000000:secret:test
          RUNNER_FUNCTION_NAME: test-runner
          ANALYZER_FUNCTION_NAME: test-analyzer
          RISK_SCORER_FUNCTION_NAME: test-scorer
          REPORT_GENERATOR_FUNCTION_NAME: test-report-gen

  # ── BUILD ─────────────────────────────────────────────────────────────────
  build:
    name: SAM Build
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: iastronauts_creditiq_back

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: SAM Build
        run: sam build --use-container --parallel

      - name: Subir artefacto de build
        uses: actions/upload-artifact@v4
        with:
          name: sam-build-${{ github.sha }}
          path: iastronauts_creditiq_back/.aws-sam/build/
          retention-days: 1

  # ── DEPLOY DEV ────────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy → dev
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/uat' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Descargar artefacto de build
        uses: actions/download-artifact@v4
        with:
          name: sam-build-${{ github.sha }}
          path: iastronauts_creditiq_back/.aws-sam/build/

      - name: SAM Deploy → dev
        working-directory: iastronauts_creditiq_back
        run: |
          sam deploy \
            --stack-name creditiq-dev \
            --s3-bucket ${{ env.SAM_ARTIFACTS_BUCKET }} \
            --s3-prefix creditiq-dev \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Stage=dev \
              LlmProvider=anthropic_api \
              AnthropicApiKey=${{ secrets.ANTHROPIC_API_KEY_DEV }}

      - name: Mostrar outputs del stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name creditiq-dev \
            --query "Stacks[0].Outputs[*].[OutputKey, OutputValue]" \
            --output table

  # ── DEPLOY PROD ───────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy → production
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.ref == 'refs/heads/main'
    environment: production   # requiere aprobación manual en GitHub

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Descargar artefacto de build
        uses: actions/download-artifact@v4
        with:
          name: sam-build-${{ github.sha }}
          path: iastronauts_creditiq_back/.aws-sam/build/

      - name: SAM Deploy → production
        working-directory: iastronauts_creditiq_back
        run: |
          sam deploy \
            --stack-name creditiq-prod \
            --s3-bucket ${{ env.SAM_ARTIFACTS_BUCKET }} \
            --s3-prefix creditiq-prod \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Stage=prod \
              LlmProvider=anthropic_api \
              AnthropicApiKey=${{ secrets.ANTHROPIC_API_KEY_PROD }}

      - name: Mostrar outputs del stack prod
        run: |
          aws cloudformation describe-stacks \
            --stack-name creditiq-prod \
            --query "Stacks[0].Outputs[*].[OutputKey, OutputValue]" \
            --output table
