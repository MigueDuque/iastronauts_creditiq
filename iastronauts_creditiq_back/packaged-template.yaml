  MarketDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: creditiq-market-data-${Stage}
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-dzaabccwauor/1d89281f2de50e5b86d1f1415c815064
      Handler: api.market_data.handler.lambda_handler
      Role:
        Fn::GetAtt:
        - ApiLambdaRole
        - Arn
      Timeout: 60
      Events:
        MarketDataEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: CreditIQApi
            Path: /market/data
            Method: GET
    Metadata:
      SamResourceId: MarketDataFunction
  MarketReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: creditiq-market-read-${Stage}
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-dzaabccwauor/1d89281f2de50e5b86d1f1415c815064
      Handler: api.market_read.handler.lambda_handler
      Role:
        Fn::GetAtt:
        - ApiLambdaRole
        - Arn
      Timeout: 30
      Events:
        MarketPulseEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: CreditIQApi
            Path: /market/pulse
            Method: GET
        MarketNewsEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: CreditIQApi
            Path: /market/news
            Method: GET
        MarketOverviewEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: CreditIQApi
            Path: /market/overview
            Method: GET
        MarketSignalsEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: CreditIQApi
            Path: /market/signals
            Method: GET
    Metadata:
      SamResourceId: MarketReadFunction
  MarketRefreshSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name:
        Fn::Sub: creditiq-market-refresh-${Stage}
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
      - Id: MarketDataTarget
        Arn:
          Fn::GetAtt:
          - MarketDataFunction
          - Arn
    Metadata:
      SamResourceId: MarketRefreshSchedule
  MarketRefreshPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::GetAtt:
        - MarketDataFunction
        - Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn:
        Fn::GetAtt:
        - MarketRefreshSchedule
        - Arn
    Metadata:
      SamResourceId: MarketRefreshPermission
  AgentRunnerDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName:
        Fn::Sub: creditiq-agent-runner-dlq-${Stage}
      MessageRetentionPeriod: 1209600
    Metadata:
      SamResourceId: AgentRunnerDLQ
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName:
        Fn::Sub: creditiq-alerts-${Stage}
    Metadata:
      SamResourceId: AlertsTopic
  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertsEmail
    Properties:
      TopicArn:
        Ref: AlertsTopic
      Protocol: email
      Endpoint:
        Ref: AlertsEmail
    Metadata:
      SamResourceId: AlertsEmailSubscription
  AlarmExtractorErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: creditiq-${Stage}-extractor-errors
      AlarmDescription: Document Extractor Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
      - Name: FunctionName
        Value:
          Ref: ExtractorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertsTopic
      OKActions:
      - Ref: AlertsTopic
    Metadata:
      SamResourceId: AlarmExtractorErrors
  AlarmAnalyzerErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: creditiq-${Stage}-analyzer-errors
      AlarmDescription: Financial Analyzer Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
      - Name: FunctionName
        Value:
          Ref: AnalyzerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertsTopic
      OKActions:
      - Ref: AlertsTopic
    Metadata:
      SamResourceId: AlarmAnalyzerErrors
  AlarmRiskScorerErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: creditiq-${Stage}-risk-scorer-errors
      AlarmDescription: Risk Scorer Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
      - Name: FunctionName
        Value:
          Ref: RiskScorerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertsTopic
      OKActions:
      - Ref: AlertsTopic
    Metadata:
      SamResourceId: AlarmRiskScorerErrors
  AlarmReportGeneratorErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: creditiq-${Stage}-report-generator-errors
      AlarmDescription: Report Generator Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
      - Name: FunctionName
        Value:
          Ref: ReportGeneratorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertsTopic
      OKActions:
      - Ref: AlertsTopic
    Metadata:
      SamResourceId: AlarmReportGeneratorErrors
  AlarmRevisorErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: creditiq-${Stage}-revisor-errors
      AlarmDescription: Revisor Inteligente Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
      - Name: FunctionName
        Value:
          Ref: RevisorInteligenteFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertsTopic
      OKActions:
      - Ref: AlertsTopic
    Metadata:
      SamResourceId: AlarmRevisorErrors
  AlarmAgentThrottles:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: creditiq-${Stage}-agent-throttles
      AlarmDescription: Any agent Lambda is being throttled
      Namespace: AWS/Lambda
      MetricName: Throttles
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertsTopic
    Metadata:
      SamResourceId: AlarmAgentThrottles
  AlarmWorkflowFailed:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: creditiq-${Stage}-workflow-executions-failed
      AlarmDescription: Step Functions executions failed (pipeline error, not review
        expiration)
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
      - Name: StateMachineArn
        Value:
          Fn::Sub: arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:creditiq-analysis-workflow-${Stage}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertsTopic
      OKActions:
      - Ref: AlertsTopic
    Metadata:
      SamResourceId: AlarmWorkflowFailed
  AlarmAgentRunnerDLQ:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: creditiq-${Stage}-agent-runner-dlq-depth
      AlarmDescription: "Messages in AgentRunner DLQ \u2014 async invocations failing\
        \ after all retries"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
      - Name: QueueName
        Value:
          Fn::GetAtt:
          - AgentRunnerDLQ
          - QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertsTopic
    Metadata:
      SamResourceId: AlarmAgentRunnerDLQ
  CreditIQDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName:
        Fn::Sub: CreditIQ-${Stage}
      DashboardBody:
        Fn::Sub: "{\n  \"widgets\": [\n    {\n      \"type\": \"text\",\n      \"\
          x\": 0, \"y\": 0, \"width\": 24, \"height\": 2,\n      \"properties\": {\n\
          \        \"markdown\": \"## CreditIQ \u2014 ${Stage}\\nMonitoring dashboard\
          \ for the analysis pipeline. Check the metric widgets below for errors and\
          \ latency.\"\n      }\n    },\n    {\n      \"type\": \"metric\",\n    \
          \  \"x\": 0, \"y\": 2, \"width\": 12, \"height\": 6,\n      \"properties\"\
          : {\n        \"title\": \"Lambda Errors \u2014 Agents\",\n        \"region\"\
          : \"${AWS::Region}\",\n        \"view\": \"timeSeries\",\n        \"stat\"\
          : \"Sum\",\n        \"period\": 300,\n        \"metrics\": [\n         \
          \ [\"AWS/Lambda\", \"Errors\", \"FunctionName\", \"creditiq-extractor-${Stage}\"\
          , {\"label\": \"Extractor\"}],\n          [\"AWS/Lambda\", \"Errors\", \"\
          FunctionName\", \"creditiq-analyzer-${Stage}\", {\"label\": \"Analyzer\"\
          }],\n          [\"AWS/Lambda\", \"Errors\", \"FunctionName\", \"creditiq-risk-scorer-${Stage}\"\
          , {\"label\": \"RiskScorer\"}],\n          [\"AWS/Lambda\", \"Errors\",\
          \ \"FunctionName\", \"creditiq-report-generator-${Stage}\", {\"label\":\
          \ \"ReportGen\"}],\n          [\"AWS/Lambda\", \"Errors\", \"FunctionName\"\
          , \"creditiq-revisor-inteligente-${Stage}\", {\"label\": \"Revisor\"}]\n\
          \        ]\n      }\n    },\n    {\n      \"type\": \"metric\",\n      \"\
          x\": 12, \"y\": 2, \"width\": 12, \"height\": 6,\n      \"properties\":\
          \ {\n        \"title\": \"Step Functions Executions\",\n        \"region\"\
          : \"${AWS::Region}\",\n        \"view\": \"timeSeries\",\n        \"stat\"\
          : \"Sum\",\n        \"period\": 300,\n        \"metrics\": [\n         \
          \ [\"AWS/States\", \"ExecutionsStarted\", \"StateMachineArn\", \"arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:creditiq-analysis-workflow-${Stage}\"\
          , {\"label\": \"Started\"}],\n          [\"AWS/States\", \"ExecutionsSucceeded\"\
          , \"StateMachineArn\", \"arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:creditiq-analysis-workflow-${Stage}\"\
          , {\"label\": \"Succeeded\"}],\n          [\"AWS/States\", \"ExecutionsFailed\"\
          , \"StateMachineArn\", \"arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:creditiq-analysis-workflow-${Stage}\"\
          , {\"label\": \"Failed\", \"color\": \"#d62728\"}]\n        ]\n      }\n\
          \    },\n    {\n      \"type\": \"metric\",\n      \"x\": 0, \"y\": 8, \"\
          width\": 12, \"height\": 6,\n      \"properties\": {\n        \"title\"\
          : \"Lambda Duration p99 \u2014 Agents (ms)\",\n        \"region\": \"${AWS::Region}\"\
          ,\n        \"view\": \"timeSeries\",\n        \"stat\": \"p99\",\n     \
          \   \"period\": 300,\n        \"metrics\": [\n          [\"AWS/Lambda\"\
          , \"Duration\", \"FunctionName\", \"creditiq-extractor-${Stage}\", {\"label\"\
          : \"Extractor\"}],\n          [\"AWS/Lambda\", \"Duration\", \"FunctionName\"\
          , \"creditiq-analyzer-${Stage}\", {\"label\": \"Analyzer\"}],\n        \
          \  [\"AWS/Lambda\", \"Duration\", \"FunctionName\", \"creditiq-risk-scorer-${Stage}\"\
          , {\"label\": \"RiskScorer\"}],\n          [\"AWS/Lambda\", \"Duration\"\
          , \"FunctionName\", \"creditiq-report-generator-${Stage}\", {\"label\":\
          \ \"ReportGen\"}]\n        ]\n      }\n    },\n    {\n      \"type\": \"\
          metric\",\n      \"x\": 12, \"y\": 8, \"width\": 12, \"height\": 6,\n  \
          \    \"properties\": {\n        \"title\": \"AgentRunner DLQ Depth\",\n\
          \        \"region\": \"${AWS::Region}\",\n        \"view\": \"timeSeries\"\
          ,\n        \"stat\": \"Maximum\",\n        \"period\": 300,\n        \"\
          metrics\": [\n          [\"AWS/SQS\", \"ApproximateNumberOfMessagesVisible\"\
          , \"QueueName\", \"creditiq-agent-runner-dlq-${Stage}\", {\"label\": \"\
          Messages in DLQ\", \"color\": \"#d62728\"}]\n        ]\n      }\n    }\n\
          \  ]\n}\n"
    Metadata:
      SamResourceId: CreditIQDashboard
Outputs:
  ApiUrl:
    Description: Base URL de la API
    Value:
      Fn::Sub: https://${CreditIQApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  MainBucketName:
    Description: Bucket principal (uploads/, reports/, rag/)
    Value:
      Ref: MainBucket
  CloudFrontUrl:
    Description: "URL p\xFAblica del frontend"
    Value:
      Fn::Sub: https://${FrontendDistribution.DomainName}
  CloudFrontDistributionId:
    Description: "ID de la distribuci\xF3n CloudFront"
    Value:
      Ref: FrontendDistribution
  FrontendBucketName:
    Description: Bucket S3 del frontend
    Value:
      Ref: FrontendBucket
  WorkflowArn:
    Description: ARN del Step Functions workflow
    Value:
      Ref: AnalysisWorkflow
  WorkflowLogGroup:
    Description: CloudWatch Log Group para el workflow
    Value:
      Ref: WorkflowLogGroup
  AlertsTopicArn:
    Description: SNS topic ARN for CloudWatch alarm notifications
    Value:
      Ref: AlertsTopic
  AgentRunnerDLQUrl:
    Description: SQS DLQ URL for failed async AgentRunner invocations
    Value:
      Ref: AgentRunnerDLQ
  DashboardUrl:
    Description: CloudWatch dashboard URL
    Value:
      Fn::Sub: https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=CreditIQ-${Stage}
  UserPoolId:
    Description: "Cognito User Pool ID \u2014 set as VITE_COGNITO_USER_POOL_ID in\
      \ the frontend"
    Value:
      Ref: CognitoUserPool
  UserPoolClientId:
    Description: "Cognito User Pool Client ID \u2014 set as VITE_COGNITO_CLIENT_ID\
      \ in the frontend"
    Value:
      Ref: CognitoUserPoolClient
  UserPoolEndpoint:
    Description: Cognito issuer URL (used by JWT authorizer)
    Value:
      Fn::Sub: https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}
  CreateFirstUserCommand:
    Description: CLI command to create the demo user (run after deploy, fill in password
      + email)
    Value:
      Fn::Sub: 'aws cognito-idp admin-create-user --user-pool-id ${CognitoUserPool}
        --username YOUR_EMAIL --temporary-password Temp1234! --user-attributes Name=email,Value=YOUR_EMAIL
        Name=email_verified,Value=true Name=custom:tenant_id,Value=btg-demo Name=custom:tenant_name,Value="BTG
        Demo" Name=custom:tenant_tier,Value=professional Name=custom:permissions,Value="analyses:create,analyses:read"
        --region ${AWS::Region}

        aws cognito-idp admin-set-user-password --user-pool-id ${CognitoUserPool}
        --username YOUR_EMAIL --password YOUR_FINAL_PASSWORD --permanent --region
        ${AWS::Region}'
