  ReportGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: creditiq-report-generator-${Stage}
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-dzaabccwauor/1d89281f2de50e5b86d1f1415c815064
      Handler: agents.report_generator.handler.lambda_handler
      Role:
        Fn::GetAtt:
