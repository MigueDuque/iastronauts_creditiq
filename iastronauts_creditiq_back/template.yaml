AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CreditIQ — Multi-Agent Financial Analysis Platform
  AI Innovation Challenge 2026 — BTG Pactual Colombia

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, uat, master]
  LlmProvider:
    Type: String
    Default: anthropic_api
    AllowedValues: [anthropic_api, bedrock]
  LlmModel:
    Type: String
    # Default to Haiku — cheapest for the mechanical extraction/analysis calls.
    # Without this, agents fall back to the hardcoded claude-sonnet-4-6 in
    # llm_provider.py (~4x the cost). Override per-deploy if a richer model is
    # wanted for the analytical agents.
    Default: claude-haiku-4-5-20251001
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ""
  GnewsApiKey:
    Type: String
    NoEcho: true
    Default: ""
  PauseHeartbeatSeconds:
    Type: Number
    Default: 86400
    Description: >
      Seconds before an analyst-review pause state times out and the execution
      transitions to ReviewExpired. Default is 24 h. Raise for longer review
      windows; lower (e.g. 3600) for tighter SLAs in production.
  AlertsEmail:
    Type: String
    Default: ""
    Description: Email address to receive CloudWatch alarm notifications (optional).

Conditions:
  # Only provision the Anthropic secret + grant access when a key is supplied at
  # deploy time. Dev/bedrock deployments that pass no key skip it cleanly.
  HasAnthropicKey: !Not [!Equals [!Ref AnthropicApiKey, ""]]
  # Only create the email SNS subscription when an address was supplied.
  HasAlertsEmail: !Not [!Equals [!Ref AlertsEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Architectures: [arm64]
    Tracing: Active
    Environment:
      Variables:
        STAGE: !Ref Stage
        MAIN_BUCKET: !Ref MainBucket
        WORKFLOW_ARN: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:creditiq-analysis-workflow-${Stage}"
        LLM_PROVIDER: !Ref LlmProvider
        LLM_MODEL: !Ref LlmModel
        # API key is resolved from Secrets Manager in production (see AnthropicApiKeySecret).
        # Local dev still reads ANTHROPIC_API_KEY directly from .env.
        ANTHROPIC_API_KEY_SECRET_ARN: !Ref AnthropicApiKeySecret
        GNEWS_API_KEY: !Ref GnewsApiKey
        AWS_ACCOUNT_ID: !Ref AWS::AccountId
  HttpApi:
    CorsConfiguration:
      AllowMethods:
        - GET
        - POST
        - DELETE
        - OPTIONS
      AllowHeaders:
        - Content-Type
        - Authorization
        - X-Tenant-Id
      AllowOrigins:
        - '*'

# ─────────────────────────────────────────────
# STORAGE
# ─────────────────────────────────────────────
Resources:

  # Anthropic API key stored in Secrets Manager instead of plaintext Lambda env vars.
  # The secret ALWAYS exists; its value is only (re)written when AnthropicApiKey is
  # passed at deploy time. Omitting the param leaves the existing value untouched —
  # so a value set out-of-band (aws secretsmanager put-secret-value) survives
  # redeploys and you never have to pass the key just to ship unrelated changes.
  AnthropicApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "creditiq-anthropic-api-key-${Stage}"
      Description: Anthropic API key for CreditIQ LLM calls
      SecretString: !If [HasAnthropicKey, !Ref AnthropicApiKey, !Ref "AWS::NoValue"]

  # Único bucket con 3 prefijos: uploads/, reports/, rag/
  MainBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "iastronauts-creditiq-${AWS::Region}-${Stage}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT, POST, HEAD]
            AllowedOrigins: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          # Archivos subidos por el usuario: expirar en 7 días
          - Id: expire-uploads
            Prefix: uploads/
            Status: Enabled
            ExpirationInDays: 7
          # Artefactos intermedios por job (status/extractor/analyzer/…): expirar a 30 días.
          # reports/ NO tiene regla — es el entregable y se conserva indefinidamente.
          - Id: expire-job-artifacts
            Prefix: jobs/
            Status: Enabled
            ExpirationInDays: 30

  # Bucket para el frontend (CloudFront OAC)
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "iastronauts-creditiq-frontend-${AWS::Region}-${Stage}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "creditiq-oac-${Stage}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods: [GET, HEAD, OPTIONS]
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        PriceClass: PriceClass_100

# ─────────────────────────────────────────────
# IAM ROLES
# ─────────────────────────────────────────────

  # Rol compartido para Lambdas de la API (Orchestrator, PresignedUrl, Status, Report)
  ApiLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "creditiq-api-lambda-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ApiLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${MainBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt MainBucket.Arn
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:creditiq-analysis-workflow-${Stage}"
              - Effect: Allow
                Action: states:DescribeExecution
                Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:creditiq-analysis-workflow-${Stage}:*"
              - Effect: Allow
                Action: states:StopExecution
                Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:creditiq-analysis-workflow-${Stage}:*"
              - Effect: Allow
                Action: states:SendTaskSuccess
                Resource: "*"
              # agent_runner re-runs a single agent outside Step Functions by invoking
              # its Lambda directly; continue_analysis falls back to agent_runner.
              # Self ARN built via !Sub (not !GetAtt) to avoid a Role↔Function cycle.
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt AnalyzerFunction.Arn
                  - !GetAtt RiskScorerFunction.Arn
                  - !GetAtt ReportGeneratorFunction.Arn
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:creditiq-agent-runner-${Stage}"
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AnthropicApiKeySecret
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt AgentRunnerDLQ.Arn

  # Rol para Lambdas de agentes (Step Functions)
  AgentLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "creditiq-agent-lambda-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AgentLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${MainBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt MainBucket.Arn
              - Effect: Allow
                Action:
                  - textract:StartDocumentTextDetection
                  - textract:GetDocumentTextDetection
                  - textract:StartDocumentAnalysis
                  - textract:GetDocumentAnalysis
                  - textract:AnalyzeDocument
                Resource: "*"
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AnthropicApiKeySecret

  WorkflowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/states/creditiq-analysis-workflow-${Stage}"
      RetentionInDays: 30

  # Rol para Step Functions
  WorkflowRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "creditiq-workflow-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt ExtractorFunction.Arn
                  - !GetAtt AnalyzerFunction.Arn
                  - !GetAtt RiskScorerFunction.Arn
                  - !GetAtt ReportGeneratorFunction.Arn
                  - !GetAtt RevisorInteligenteFunction.Arn
                  - !GetAtt PauseFunction.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutLogEvents
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"

# ─────────────────────────────────────────────
# API GATEWAY + LAMBDAS DE ENTRADA
# ─────────────────────────────────────────────

  CreditIQApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      Description: CreditIQ API — Financial Analysis Platform

  # POST /upload-url  → genera presigned URL para subir archivo a S3
  PresignedUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "creditiq-presigned-url-${Stage}"
      CodeUri: src/
      Handler: api.presigned_url.handler.lambda_handler
      Role: !GetAtt ApiLambdaRole.Arn
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref CreditIQApi
            Path: /upload-url
            Method: POST

  # POST /analyses  → Orchestrator: valida, crea job_id, dispara Step Functions
  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "creditiq-orchestrator-${Stage}"
      CodeUri: src/
      Handler: api.orchestrator.handler.lambda_handler
      Role: !GetAtt ApiLambdaRole.Arn
      Timeout: 60
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref CreditIQApi
            Path: /analyses
            Method: POST

  # GET /jobs  → lista de jobs en S3 (picker "Load previous job" del frontend)
  ListJobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "creditiq-list-jobs-${Stage}"
      CodeUri: src/
      Handler: api.list_jobs.handler.lambda_handler
      Role: !GetAtt ApiLambdaRole.Arn
      Timeout: 30
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref CreditIQApi
            Path: /jobs
            Method: GET

  # GET /analyses/{id}  → estado del análisis (polling)
  AnalysisStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "creditiq-analysis-status-${Stage}"
      CodeUri: src/
      Handler: api.analysis_status.handler.lambda_handler
      Role: !GetAtt ApiLambdaRole.Arn
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref CreditIQApi
            Path: /analyses/{analysis_id}
            Method: GET

  # POST /analyses/{id}/continue  → reanuda el pipeline desde el punto de pausa
  ContinueAnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "creditiq-continue-analysis-${Stage}"
      CodeUri: src/
      Handler: api.continue_analysis.handler.lambda_handler
      Role: !GetAtt ApiLambdaRole.Arn
      Timeout: 30
      Environment:
        Variables:
          RUNNER_FUNCTION_NAME: !Ref AgentRunnerFunction
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref CreditIQApi
            Path: /analyses/{analysis_id}/continue
            Method: POST

  # POST /analyses/{id}/reanalyze  y  /reanalyze-scorer
  # → re-ejecuta un solo agente (2 o 3) fuera de Step Functions. Espejo de los
  #   runners de local_server.py. Invoca el Lambda del agente directamente y
  #   registra el estado en status.json con source="reanalyze".
  AgentRunnerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "creditiq-agent-runner-${Stage}"
      CodeUri: src/
      Handler: api.agent_runner.handler.lambda_handler
      Role: !GetAtt ApiLambdaRole.Arn
      # Must exceed the longest agent timeout (Analyzer = 300s) because the worker
      # invocation waits synchronously for the agent Lambda to finish.
      Timeout: 360
      MemorySize: 256
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt AgentRunnerDLQ.Arn
      Environment:
        Variables:
          ANALYZER_FUNCTION_NAME: !Ref AnalyzerFunction
          RISK_SCORER_FUNCTION_NAME: !Ref RiskScorerFunction
          REPORT_GENERATOR_FUNCTION_NAME: !Ref ReportGeneratorFunction
      Events:
        ReanalyzeEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref CreditIQApi
            Path: /analyses/{analysis_id}/reanalyze
            Method: POST
        ReanalyzeScorerEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref CreditIQApi
            Path: /analyses/{analysis_id}/reanalyze-scorer
            Method: POST

  # GET /analyses/{id}/report  → URL del reporte generado
  ReportUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "creditiq-report-url-${Stage}"
      CodeUri: src/
      Handler: api.report_url.handler.lambda_handler
      Role: !GetAtt ApiLambdaRole.Arn
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref CreditIQApi
            Path: /analyses/{analysis_id}/report
            Method: GET

  # GET /analyses/{id}/extractor · /analyzer · /scorer
  # → artefactos crudos de Agente 1 / Agente 2 / Agente 3 (vistas por agente del
  #   frontend). /analyzer evita sobrecargar /report, que sirve la URL del reporte.
  JobArtifactFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "creditiq-job-artifact-${Stage}"
      CodeUri: src/
      Handler: api.job_artifact.handler.lambda_handler
      Role: !GetAtt ApiLambdaRole.Arn
      Timeout: 30
      Events:
        ExtractorEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref CreditIQApi
            Path: /analyses/{analysis_id}/extractor
            Method: GET
        AnalyzerEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref CreditIQApi
            Path: /analyses/{analysis_id}/analyzer
            Method: GET
        ScorerEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref CreditIQApi
            Path: /analyses/{analysis_id}/scorer
            Method: GET

  # DELETE /analyses/{id}  → cancela la ejecución de Step Functions y marca el job como cancelado
  CancelAnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "creditiq-cancel-analysis-${Stage}"
      CodeUri: src/
      Handler: api.cancel_analysis.handler.lambda_handler
      Role: !GetAtt ApiLambdaRole.Arn
      Timeout: 30
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref CreditIQApi
            Path: /analyses/{analysis_id}
            Method: DELETE

# ─────────────────────────────────────────────
# STEP FUNCTIONS — AGENTES
# ─────────────────────────────────────────────

  AnalysisWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "creditiq-analysis-workflow-${Stage}"
      DefinitionUri: step_functions/analysis_workflow.json
      DefinitionSubstitutions:
        ExtractorFunctionArn: !GetAtt ExtractorFunction.Arn
        AnalyzerFunctionArn: !GetAtt AnalyzerFunction.Arn
        RiskScorerFunctionArn: !GetAtt RiskScorerFunction.Arn
        ReportGeneratorFunctionArn: !GetAtt ReportGeneratorFunction.Arn
        RevisorFunctionArn: !GetAtt RevisorInteligenteFunction.Arn
        PauseFunctionArn: !GetAtt PauseFunction.Arn
        PauseHeartbeatSeconds: !Ref PauseHeartbeatSeconds
      Role: !GetAtt WorkflowRole.Arn
      Type: STANDARD
      Tracing:
        Enabled: true
      Logging:
        # Log every state transition for debuggability. IncludeExecutionData stays
        # false on purpose: execution payloads carry tenant financial data we do not
        # want dumped into CloudWatch. The execution history (console/API) still has
        # full data for authorized debugging.
        Level: ALL
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt WorkflowLogGroup.Arn

  PauseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "creditiq-pause-${Stage}"
      CodeUri: src/
      Handler: agents.pause.handler.lambda_handler
      Role: !GetAtt AgentLambdaRole.Arn
      Timeout: 10
      MemorySize: 128

  ExtractorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "creditiq-extractor-${Stage}"
      CodeUri: src/
      Handler: agents.document_extractor.handler.lambda_handler
      Role: !GetAtt AgentLambdaRole.Arn
      Timeout: 300
      MemorySize: 512

  AnalyzerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "creditiq-analyzer-${Stage}"
      CodeUri: src/
      Handler: agents.financial_analyzer.handler.lambda_handler
      Role: !GetAtt AgentLambdaRole.Arn
      Timeout: 300
      MemorySize: 512

  RiskScorerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "creditiq-risk-scorer-${Stage}"
      CodeUri: src/
      Handler: agents.risk_scorer.handler.lambda_handler
      Role: !GetAtt AgentLambdaRole.Arn
      Timeout: 180
      MemorySize: 256

  ReportGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "creditiq-report-generator-${Stage}"
      CodeUri: src/
      Handler: agents.report_generator.handler.lambda_handler
      Role: !GetAtt AgentLambdaRole.Arn
      Timeout: 300
      MemorySize: 512

  RevisorInteligenteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "creditiq-revisor-inteligente-${Stage}"
      CodeUri: src/
      Handler: agents.revisor_inteligente.handler.lambda_handler
      Role: !GetAtt AgentLambdaRole.Arn
      Timeout: 300
      MemorySize: 512

# ─────────────────────────────────────────────
# MARKET DATA LAMBDAS
# ─────────────────────────────────────────────

  # GET /market/data — live market data snapshot (yfinance + GNews)
  MarketDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "creditiq-market-data-${Stage}"
      CodeUri: src/
      Handler: api.market_data.handler.lambda_handler
      Role: !GetAtt ApiLambdaRole.Arn
      Timeout: 60
      Events:
        MarketDataEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref CreditIQApi
            Path: /market/data
            Method: GET

  # GET /market/pulse, /market/news, /market/overview, /market/signals
  # → serve the cached AI market pulse (no live fetching on request path)
  MarketReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "creditiq-market-read-${Stage}"
      CodeUri: src/
      Handler: api.market_read.handler.lambda_handler
      Role: !GetAtt ApiLambdaRole.Arn
      Timeout: 30
      Events:
        MarketPulseEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref CreditIQApi
            Path: /market/pulse
            Method: GET
        MarketNewsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref CreditIQApi
            Path: /market/news
            Method: GET
        MarketOverviewEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref CreditIQApi
            Path: /market/overview
            Method: GET
        MarketSignalsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref CreditIQApi
            Path: /market/signals
            Method: GET

  # EventBridge scheduled rule — refresh market pulse every 5 minutes in prod
  MarketRefreshSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "creditiq-market-refresh-${Stage}"
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Id: MarketDataTarget
          Arn: !GetAtt MarketDataFunction.Arn

  MarketRefreshPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt MarketDataFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MarketRefreshSchedule.Arn

# ─────────────────────────────────────────────
# OBSERVABILITY — SNS, CloudWatch Alarms, DLQ, Dashboard
# ─────────────────────────────────────────────

  # SQS Dead Letter Queue for async AgentRunner invocations.
  # Any event that fails all Lambda retries lands here for investigation.
  AgentRunnerDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "creditiq-agent-runner-dlq-${Stage}"
      MessageRetentionPeriod: 1209600   # 14 days

  # Central SNS topic — subscribe an email (optional) or wire to PagerDuty/Slack.
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "creditiq-alerts-${Stage}"

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertsEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertsEmail

  # ── Lambda Error Alarms ────────────────────────────────────────────────────
  # One alarm per critical Lambda: fires when ≥1 error occurs in a 5-min window.

  AlarmExtractorErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "creditiq-${Stage}-extractor-errors"
      AlarmDescription: Document Extractor Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ExtractorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  AlarmAnalyzerErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "creditiq-${Stage}-analyzer-errors"
      AlarmDescription: Financial Analyzer Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AnalyzerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  AlarmRiskScorerErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "creditiq-${Stage}-risk-scorer-errors"
      AlarmDescription: Risk Scorer Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RiskScorerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  AlarmReportGeneratorErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "creditiq-${Stage}-report-generator-errors"
      AlarmDescription: Report Generator Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReportGeneratorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  AlarmRevisorErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "creditiq-${Stage}-revisor-errors"
      AlarmDescription: Revisor Inteligente Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RevisorInteligenteFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  # ── Lambda Throttle Alarms ─────────────────────────────────────────────────
  # Throttles on agent Lambdas indicate concurrency exhaustion — a hard blocker.

  AlarmAgentThrottles:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "creditiq-${Stage}-agent-throttles"
      AlarmDescription: Any agent Lambda is being throttled
      Namespace: AWS/Lambda
      MetricName: Throttles
      # No FunctionName dimension — aggregates across ALL functions in the account.
      # Filter to this stage via the alarm name convention; separate per-function
      # alarms can be added if needed.
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # ── Step Functions Alarm ───────────────────────────────────────────────────

  AlarmWorkflowFailed:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "creditiq-${Stage}-workflow-executions-failed"
      AlarmDescription: Step Functions executions failed (pipeline error, not review expiration)
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:creditiq-analysis-workflow-${Stage}"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  # ── DLQ Depth Alarm ────────────────────────────────────────────────────────

  AlarmAgentRunnerDLQ:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "creditiq-${Stage}-agent-runner-dlq-depth"
      AlarmDescription: Messages in AgentRunner DLQ — async invocations failing after all retries
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AgentRunnerDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # ── CloudWatch Dashboard ───────────────────────────────────────────────────

  CreditIQDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "CreditIQ-${Stage}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "alarm",
              "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": {
                "title": "Alarm Status",
                "alarms": [
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:creditiq-${Stage}-extractor-errors",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:creditiq-${Stage}-analyzer-errors",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:creditiq-${Stage}-risk-scorer-errors",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:creditiq-${Stage}-report-generator-errors",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:creditiq-${Stage}-revisor-errors",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:creditiq-${Stage}-workflow-executions-failed",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:creditiq-${Stage}-agent-runner-dlq-depth"
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 2, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Errors — Agents",
                "view": "timeSeries",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "creditiq-extractor-${Stage}", {"label": "Extractor"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "creditiq-analyzer-${Stage}", {"label": "Analyzer"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "creditiq-risk-scorer-${Stage}", {"label": "RiskScorer"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "creditiq-report-generator-${Stage}", {"label": "ReportGen"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "creditiq-revisor-inteligente-${Stage}", {"label": "Revisor"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 2, "width": 12, "height": 6,
              "properties": {
                "title": "Step Functions Executions",
                "view": "timeSeries",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  ["AWS/States", "ExecutionsStarted", "StateMachineArn", "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:creditiq-analysis-workflow-${Stage}", {"label": "Started"}],
                  ["AWS/States", "ExecutionsSucceeded", "StateMachineArn", "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:creditiq-analysis-workflow-${Stage}", {"label": "Succeeded"}],
                  ["AWS/States", "ExecutionsFailed", "StateMachineArn", "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:creditiq-analysis-workflow-${Stage}", {"label": "Failed", "color": "#d62728"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 8, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Duration p99 — Agents (ms)",
                "view": "timeSeries",
                "stat": "p99",
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "creditiq-extractor-${Stage}", {"label": "Extractor"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "creditiq-analyzer-${Stage}", {"label": "Analyzer"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "creditiq-risk-scorer-${Stage}", {"label": "RiskScorer"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "creditiq-report-generator-${Stage}", {"label": "ReportGen"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 8, "width": 12, "height": 6,
              "properties": {
                "title": "AgentRunner DLQ Depth",
                "view": "timeSeries",
                "stat": "Maximum",
                "period": 300,
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "creditiq-agent-runner-dlq-${Stage}", {"label": "Messages in DLQ", "color": "#d62728"}]
                ]
              }
            }
          ]
        }

# ─────────────────────────────────────────────
# OUTPUTS
# ─────────────────────────────────────────────

Outputs:
  ApiUrl:
    Description: Base URL de la API
    Value: !Sub "https://${CreditIQApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"

  MainBucketName:
    Description: Bucket principal (uploads/, reports/, rag/)
    Value: !Ref MainBucket

  CloudFrontUrl:
    Description: URL pública del frontend
    Value: !Sub "https://${FrontendDistribution.DomainName}"

  CloudFrontDistributionId:
    Description: ID de la distribución CloudFront
    Value: !Ref FrontendDistribution

  FrontendBucketName:
    Description: Bucket S3 del frontend
    Value: !Ref FrontendBucket

  WorkflowArn:
    Description: ARN del Step Functions workflow
    Value: !Ref AnalysisWorkflow

  WorkflowLogGroup:
    Description: CloudWatch Log Group para el workflow
    Value: !Ref WorkflowLogGroup

  AlertsTopicArn:
    Description: SNS topic ARN for CloudWatch alarm notifications
    Value: !Ref AlertsTopic

  AgentRunnerDLQUrl:
    Description: SQS DLQ URL for failed async AgentRunner invocations
    Value: !Ref AgentRunnerDLQ

  DashboardUrl:
    Description: CloudWatch dashboard URL
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=CreditIQ-${Stage}"