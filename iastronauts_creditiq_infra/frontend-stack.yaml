AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CreditIQ — Frontend Infrastructure (S3 + CloudFront + Upload API)
  Standalone stack, deployed independently of the backend SAM stack.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, uat, master]
  MainBucketName:
    Type: String
    Default: iastronauts-creditiq-us-east-1-dev

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 128
    Architectures: [arm64]

Resources:

  # ── S3 Bucket (private, served only via CloudFront OAC) ──────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub "iastronauts-creditiq-frontend-${AWS::Region}-${Stage}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  # ── CloudFront Origin Access Control ─────────────────────────────────
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "creditiq-oac-${Stage}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── CloudFront Distribution ───────────────────────────────────────────
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Comment: !Sub "CreditIQ Frontend — ${Stage}"
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          AllowedMethods: [GET, HEAD, OPTIONS]
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        PriceClass: PriceClass_100

  # ── Upload Presigned URL API ──────────────────────────────────────────
  UploadApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - POST
          - OPTIONS

  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "creditiq-upload-url-${Stage}"
      Handler: index.lambda_handler
      Environment:
        Variables:
          MAIN_BUCKET: !Ref MainBucketName
      Policies:
        - S3WritePolicy:
            BucketName: !Ref MainBucketName
      Events:
        PostUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /upload-url
            Method: POST
      InlineCode: |
        import json, boto3, os
        s3 = boto3.client('s3')
        BUCKET = os.environ['MAIN_BUCKET']
        def lambda_handler(event, context):
          headers = {'Access-Control-Allow-Origin': '*', 'Access-Control-Allow-Headers': 'Content-Type', 'Access-Control-Allow-Methods': 'POST,OPTIONS'}
          try:
            body = json.loads(event.get('body') or '{}')
            folder = body.get('folder_name', 'default').strip().strip('/')
            file_name = body.get('file_name', 'document')
            content_type = body.get('content_type', 'application/octet-stream')
            key = f"uploads/{folder}/{file_name}"
            url = s3.generate_presigned_url('put_object', Params={'Bucket': BUCKET, 'Key': key, 'ContentType': content_type}, ExpiresIn=3600)
            return {'statusCode': 200, 'headers': headers, 'body': json.dumps({'url': url, 's3_key': key})}
          except Exception as e:
            return {'statusCode': 500, 'headers': headers, 'body': json.dumps({'error': str(e)})}

Outputs:
  CloudFrontUrl:
    Description: Public URL of the frontend
    Value: !Sub "https://${FrontendDistribution.DomainName}"
    Export:
      Name: !Sub "creditiq-frontend-url-${Stage}"

  CloudFrontDistributionId:
    Description: CloudFront Distribution ID (needed for cache invalidation on deploy)
    Value: !Ref FrontendDistribution
    Export:
      Name: !Sub "creditiq-frontend-dist-id-${Stage}"

  FrontendBucketName:
    Description: S3 bucket where frontend assets are uploaded
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub "creditiq-frontend-bucket-${Stage}"

  UploadApiUrl:
    Description: URL of the presigned upload API
    Value: !Sub "https://${UploadApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
    Export:
      Name: !Sub "creditiq-upload-api-url-${Stage}"
